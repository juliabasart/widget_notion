<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flip Clock</title>

  <link href="https://fonts.googleapis.com/css?family=Droid+Sans+Mono&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    html, body, #app {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body { background: transparent; }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: transparent;
    }

    /* ===== Theme variables ===== */
    .theme-dark {
      --card-bg-top: #141820;
      --card-bg-bottom: #0f1115;
      --card-border: rgba(255,255,255,.08);
      --digit-color: #fff;
      --shadow: 0 10px 20px rgba(0,0,0,.5);
      --switch-bg: #26292f;
      --switch-knob: #fff;
    }

    .theme-light {
      --card-bg-top: #f2f2f2;
      --card-bg-bottom: #e6e6e6;
      --card-border: rgba(0,0,0,.08);
      --digit-color: #555;
      --shadow: 0 10px 20px rgba(0,0,0,.15);
      --switch-bg: #cfcfcf;
      --switch-knob: #555;
    }

    .flipClock {
      display: flex;
      gap: 10px;
      cursor: pointer;
    }

    .flipUnitContainer {
      position: relative;
      width: 73px;
      height: 62px;
      perspective: 218px;
      perspective-origin: 50% 50%;
      background: var(--card-bg-bottom);
      border-radius: 5px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .upperCard, .lowerCard {
      position: relative;
      height: 50%;
      display: flex;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: linear-gradient(to bottom, var(--card-bg-top), var(--card-bg-bottom));
    }

    .upperCard {
      align-items: flex-end;
      border-radius: 5px 5px 0 0;
      border-bottom-width: 0.5px;
    }

    .lowerCard {
      align-items: flex-start;
      border-radius: 0 0 5px 5px;
      border-top-width: 0.5px;
    }

    .upperCard span { transform: translateY(50%); }
    .lowerCard span { transform: translateY(-50%); }

    .upperCard span,
    .lowerCard span,
    .flipCard span {
      font-family: 'Droid Sans Mono', monospace;
      font-size: 2.55em;
      font-weight: 300;
      color: var(--digit-color);
      line-height: 1;
      transition: color .3s ease;
    }

    /* Camada animada base */
    .flipCard {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      border: 0.5px solid var(--card-border);
      background: var(--card-bg-bottom);
    }

    /* TOP HALF: dobra de 0 -> -180 */
    .flipCard.fold {
      top: 0;
      align-items: flex-end;
      transform-origin: 50% 100%;
      transform: rotateX(0deg);
      border-radius: 5px 5px 0 0;
      border-bottom-width: 0.5px;
      animation: fold 0.6s cubic-bezier(.455,.03,.515,.955) forwards;
      transform-style: preserve-3d;
    }
    .flipCard.fold span { transform: translateY(50%); }

    /* BOTTOM HALF: desdobra de 180 -> 0 */
    .flipCard.unfold {
      top: 50%;
      align-items: flex-start;
      transform-origin: 50% 0%;
      transform: rotateX(180deg);
      border-radius: 0 0 5px 5px;
      border-top-width: 0.5px;
      animation: unfold 0.6s cubic-bezier(.455,.03,.515,.955) forwards;
      transform-style: preserve-3d;
    }
    .flipCard.unfold span { transform: translateY(-50%); }

    @keyframes fold {
      from { transform: rotateX(0deg); }
      to   { transform: rotateX(-180deg); }
    }

    @keyframes unfold {
      from { transform: rotateX(180deg); }
      to   { transform: rotateX(0deg); }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const AnimatedCard = ({ animation, digit }) => (
      <div className={`flipCard ${animation}`}>
        <span>{digit}</span>
      </div>
    );

    const StaticCard = ({ position, digit }) => (
      <div className={position}>
        <span>{digit}</span>
      </div>
    );

    const FlipUnitContainer = ({ digit, shuffle, unit }) => {
      let currentDigit = digit;
      let previousDigit = digit - 1;

      const max = unit === 'hours' ? 23 : 59;
      if (previousDigit < 0) previousDigit = max;

      const cur = currentDigit < 10 ? `0${currentDigit}` : `${currentDigit}`;
      const prev = previousDigit < 10 ? `0${previousDigit}` : `${previousDigit}`;

      const digit1 = shuffle ? prev : cur;
      const digit2 = !shuffle ? prev : cur;

      const animation1 = shuffle ? 'fold' : 'unfold';
      const animation2 = !shuffle ? 'fold' : 'unfold';

      return (
        <div className="flipUnitContainer">
          <StaticCard position="upperCard" digit={cur} />
          <StaticCard position="lowerCard" digit={prev} />
          <AnimatedCard digit={digit1} animation={animation1} />
          <AnimatedCard digit={digit2} animation={animation2} />
        </div>
      );
    };

    class FlipClock extends React.Component {
      constructor(props){
        super(props);
        this.state = {
          hours: 0, hoursShuffle: true,
          minutes: 0, minutesShuffle: true,
          seconds: 0, secondsShuffle: true,
          theme: 'light'
        };
        this.toggleTheme = this.toggleTheme.bind(this);
      }

      componentDidMount() {
        this.timerID = setInterval(() => this.updateTime(), 50);
      }

      componentWillUnmount() {
        clearInterval(this.timerID);
      }

      updateTime() {
        const time = new Date();
        const hours = time.getHours();
        const minutes = time.getMinutes();
        const seconds = time.getSeconds();

        if (hours !== this.state.hours) {
          this.setState({ hours, hoursShuffle: !this.state.hoursShuffle });
        }
        if (minutes !== this.state.minutes) {
          this.setState({ minutes, minutesShuffle: !this.state.minutesShuffle });
        }
        if (seconds !== this.state.seconds) {
          this.setState({ seconds, secondsShuffle: !this.state.secondsShuffle });
        }
      }

      toggleTheme() {
        this.setState(prev => ({ theme: prev.theme === 'dark' ? 'light' : 'dark' }));
      }

      render() {
        const { hours, minutes, seconds, hoursShuffle, minutesShuffle, secondsShuffle, theme } = this.state;
        return (
          <div className={`app-inner theme-${theme}`} style={{display:'flex', flexDirection:'column', alignItems:'center'}}>
            <div className="flipClock" onClick={this.toggleTheme} title="Pulsa para cambiar de modo">
              <FlipUnitContainer unit="hours" digit={hours} shuffle={hoursShuffle} />
              <FlipUnitContainer unit="minutes" digit={minutes} shuffle={minutesShuffle} />
              <FlipUnitContainer unit="seconds" digit={seconds} shuffle={secondsShuffle} />
            </div>
          </div>
        );
      }
    }

    ReactDOM.render(<FlipClock />, document.getElementById('app'));
  </script>
</body>
</html>
