<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flip Clock</title>

  <link href="https://fonts.googleapis.com/css?family=Droid+Sans+Mono&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    html, body, #app {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body { background: transparent; }

    #app {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    .app-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== Theme variables ===== */
    .theme-dark {
      --card-bg-top: #141820;
      --card-bg-bottom: #0f1115;
      --card-border: rgba(255,255,255,.08);
      --digit-color: #fff;
      --shadow: 0 10px 20px rgba(0,0,0,.5);
    }

    .theme-light {
      --card-bg-top: #f2f2f2;
      --card-bg-bottom: #e6e6e6;
      --card-border: rgba(0,0,0,.08);
      --digit-color: #555;
      --shadow: 0 10px 20px rgba(0,0,0,.15);
    }

    .flipClock {
      display: flex;
      gap: 10px;
      cursor: pointer;
    }

    .flipUnitContainer {
      position: relative;
      width: 73px;
      height: 62px;
      perspective: 218px;
      perspective-origin: 50% 50%;
      background: var(--card-bg-bottom);
      border-radius: 5px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .upperCard, .lowerCard {
      position: relative;
      height: 50%;
      display: flex;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: linear-gradient(to bottom, var(--card-bg-top), var(--card-bg-bottom));
    }

    .upperCard {
      align-items: flex-end;
      border-radius: 5px 5px 0 0;
      border-bottom-width: 0.5px;
    }

    .lowerCard {
      align-items: flex-start;
      border-radius: 0 0 5px 5px;
      border-top-width: 0.5px;
    }

    .upperCard span { transform: translateY(50%); }
    .lowerCard span { transform: translateY(-50%); }

    .upperCard span,
    .lowerCard span,
    .flipCard span {
      font-family: 'Droid Sans Mono', monospace;
      font-size: 2.55em;
      font-weight: 300;
      color: var(--digit-color);
      line-height: 1;
      transition: color .3s ease;
    }

    .flipCard {
      position: absolute;
      left: 0;
      width: 100%;
      height: 50%;
      overflow: hidden;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      border: 0.5px solid var(--card-border);
      background: var(--card-bg-bottom);
    }

    .flipCard.fold {
      top: 0;
      align-items: flex-end;
      transform-origin: 50% 100%;
      transform: rotateX(0deg);
      border-radius: 5px 5px 0 0;
      border-bottom-width: 0.5px;
      animation: fold 0.6s cubic-bezier(.455,.03,.515,.955) forwards;
      transform-style: preserve-3d;
    }
    .flipCard.fold span { transform: translateY(50%); }

    .flipCard.unfold {
      top: 50%;
      align-items: flex-start;
      transform-origin: 50% 0%;
      transform: rotateX(180deg);
      border-radius: 0 0 5px 5px;
      border-top-width: 0.5px;
      animation: unfold 0.6s cubic-bezier(.455,.03,.515,.955) forwards;
      transform-style: preserve-3d;
    }
    .flipCard.unfold span { transform: translateY(-50%); }

    @keyframes fold {
      from { transform: rotateX(0deg); }
      to   { transform: rotateX(-180deg); }
    }

    @keyframes unfold {
      from { transform: rotateX(180deg); }
      to   { transform: rotateX(0deg); }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="app-inner theme-light" id="appInner">
      <div class="flipClock" id="flipClock" title="Pulsa para cambiar de modo">
        <div class="flipUnitContainer" id="unit-hours"></div>
        <div class="flipUnitContainer" id="unit-minutes"></div>
        <div class="flipUnitContainer" id="unit-seconds"></div>
      </div>
    </div>
  </div>

  <script>
    const pad = n => (n < 10 ? '0' + n : '' + n);

    const units = {
      hours:   { el: document.getElementById('unit-hours'),   value: -1, shuffle: true, max: 23 },
      minutes: { el: document.getElementById('unit-minutes'), value: -1, shuffle: true, max: 59 },
      seconds: { el: document.getElementById('unit-seconds'), value: -1, shuffle: true, max: 59 }
    };

    function renderUnit(unit, current, animate) {
      const u = units[unit];
      let prev = current - 1;
      if (prev < 0) prev = u.max;

      const cur = pad(current);
      const prevStr = pad(prev);

      if (!animate) {
        u.el.innerHTML = `
          <div class="upperCard"><span>${cur}</span></div>
          <div class="lowerCard"><span>${prevStr}</span></div>
        `;
        return;
      }

      u.shuffle = !u.shuffle;
      const digit1 = u.shuffle ? prevStr : cur;
      const digit2 = !u.shuffle ? prevStr : cur;
      const anim1 = u.shuffle ? 'fold' : 'unfold';
      const anim2 = !u.shuffle ? 'fold' : 'unfold';

      u.el.innerHTML = `
        <div class="upperCard"><span>${cur}</span></div>
        <div class="lowerCard"><span>${prevStr}</span></div>
        <div class="flipCard ${anim1}"><span>${digit1}</span></div>
        <div class="flipCard ${anim2}"><span>${digit2}</span></div>
      `;
    }

    function updateTime() {
      const now = new Date();
      const values = { hours: now.getHours(), minutes: now.getMinutes(), seconds: now.getSeconds() };

      Object.keys(values).forEach(key => {
        const u = units[key];
        const val = values[key];
        if (val !== u.value) {
          const animate = u.value !== -1;
          renderUnit(key, val, animate);
          u.value = val;
        }
      });
    }

    updateTime();
    setInterval(updateTime, 200);

    document.getElementById('flipClock').addEventListener('click', () => {
      const inner = document.getElementById('appInner');
      inner.classList.toggle('theme-dark');
      inner.classList.toggle('theme-light');
    });
  </script>
</body>
</html>
